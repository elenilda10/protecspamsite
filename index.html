<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ProtecSpam • Detalhes</title>
  <!-- Tailwind CSS CDN para renderização premium -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SDK oficial do Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Linkagem para a sua nova lógica app.js de forma assíncrona -->
  <script src="app.js" defer></script>
  <style>
    body {
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    /* Suporte a layouts e mídias gerados dinamicamente no JS */
    .media-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }
    .media-preview {
      width: 100%;
      max-height: 16rem;
      object-fit: contain;
      border-radius: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background-color: #000;
    }
    .audio-preview {
      width: 100%;
      margin-top: 0.5rem;
    }
    .file-btn {
      display: inline-block;
      width: 100%;
      text-align: center;
      padding: 0.75rem;
      background-color: #2563eb;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.875rem;
      border-radius: 0.75rem;
      transition: all 0.2s;
    }
    .file-btn:hover {
      background-color: #3b82f6;
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen pb-10">

  <!-- CONTAINER CENTRAL -->
  <div class="max-w-md mx-auto px-4 pt-6">

    <!-- HEADER DO APP -->
    <div class="glass-card rounded-2xl p-5 mb-5 flex items-center gap-4 shadow-xl">
      <div class="bg-gradient-to-tr from-rose-500 to-red-600 p-3 rounded-xl shadow-lg shadow-red-500/20">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
      </div>
      <div>
        <h1 id="appTitle" class="text-xl font-bold tracking-tight text-white">ProtecSpam</h1>
        <p id="appSubtitle" class="text-xs text-slate-400">Carregando detalhes do log...</p>
      </div>
    </div>

    <!-- SELETOR DE IDIOMAS (Abas de Controle Estilizadas) -->
    <div class="lang-switch grid grid-cols-3 gap-2 mb-6">
      <button data-lang="pt" class="py-2.5 rounded-xl text-xs font-semibold tracking-wide transition-all duration-200 bg-slate-800/80 text-slate-400 hover:bg-slate-700/50 [&.active]:bg-blue-600 [&.active]:text-white [&.active]:shadow-lg [&.active]:shadow-blue-600/25">
        🇧🇷 PT
      </button>
      <button data-lang="en" class="py-2.5 rounded-xl text-xs font-semibold tracking-wide transition-all duration-200 bg-slate-800/80 text-slate-400 hover:bg-slate-700/50 [&.active]:bg-blue-600 [&.active]:text-white [&.active]:shadow-lg [&.active]:shadow-blue-600/25">
        🇺🇸 EN
      </button>
      <button data-lang="es" class="py-2.5 rounded-xl text-xs font-semibold tracking-wide transition-all duration-200 bg-slate-800/80 text-slate-400 hover:bg-slate-700/50 [&.active]:bg-blue-600 [&.active]:text-white [&.active]:shadow-lg [&.active]:shadow-blue-600/25">
        🇪🇸 ES
      </button>
    </div>

    <!-- TELA DE LOADING (Carregando...) -->
    <div id="loading" class="glass-card rounded-2xl p-10 text-center shadow-lg">
      <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-rose-500 mx-auto mb-4"></div>
      <p id="loadingText" class="text-sm text-slate-400">Carregando informações...</p>
    </div>

    <!-- TELA DE ERRO -->
    <div id="error" class="hidden glass-card rounded-2xl p-6 text-center border-rose-500/30 shadow-lg">
      <div class="text-rose-500 mb-3">
        <svg class="w-12 h-12 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>
      <h3 id="errorTitle" class="text-lg font-bold text-white mb-1">⚠️ Erro</h3>
      <p id="errorText" class="text-sm text-slate-400 mb-4">Não foi possível carregar os dados.</p>
      <button onclick="window.location.reload()" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg transition-all">Tentar Novamente</button>
    </div>

    <!-- CONTEÚDO PRINCIPAL (DASHBOARD DO SPAM) -->
    <div id="content" class="hidden space-y-5">

      <!-- BANNER DE ALERTA -->
      <div class="bg-rose-500/10 border border-rose-500/20 rounded-2xl p-4 flex gap-3.5 items-start">
        <div class="text-rose-500 mt-0.5">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        </div>
        <div>
          <h3 id="alertTitle" class="text-sm font-bold text-rose-400">🚨 Spam detectado</h3>
          <p id="alertDesc" class="text-xs text-rose-300/85 mt-0.5 leading-relaxed">Esta mensagem foi removida pelo sistema de proteção.</p>
        </div>
      </div>

      <!-- CARD DA MENSAGEM DO INFRATOR -->
      <div class="glass-card rounded-2xl p-5 shadow-lg">
        <h3 id="contentTitle" class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">📄 Conteúdo</h3>
        <div class="bg-slate-900/60 rounded-xl p-4 border border-slate-800 max-h-40 overflow-y-auto">
          <p id="spamText" class="text-sm leading-relaxed text-slate-200 select-all whitespace-pre-wrap"></p>
        </div>
      </div>

      <!-- CARD DE MÍDIA ANEXADA -->
      <div id="mediaCard" class="hidden glass-card rounded-2xl p-5 shadow-lg">
        <h3 id="mediaTitle" class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">🖼️ Mídia enviada</h3>
        <div id="mediaBox" class="rounded-xl overflow-hidden flex flex-col justify-center items-center"></div>
      </div>

      <!-- CARD DE DETALHES TÉCNICOS -->
      <div class="glass-card rounded-2xl p-5 shadow-lg space-y-4">
        
        <!-- PROPRIEDADES DE INFORMAÇÕES -->
        <div class="grid grid-cols-1 gap-3.5 text-sm">
          <div class="flex justify-between border-b border-slate-800 pb-2">
            <span id="labelGroup" class="text-slate-400 font-medium">Grupo</span>
            <span id="group" class="font-bold text-slate-200"></span>
          </div>
          <div class="flex justify-between border-b border-slate-800 pb-2">
            <span id="labelMessage" class="text-slate-400 font-medium">Mensagem</span>
            <span id="message" class="font-bold text-slate-200"></span>
          </div>
          <div class="flex justify-between border-b border-slate-800 pb-2">
            <span id="labelUser" class="text-slate-400 font-medium">Usuário</span>
            <span id="user" class="font-bold text-blue-400"></span>
          </div>
          <div class="flex justify-between border-b border-slate-800 pb-2">
            <span id="labelUserId" class="text-slate-400 font-medium">ID</span>
            <span id="userId" class="font-mono text-slate-300"></span>
          </div>
          <div class="flex justify-between border-b border-slate-800 pb-2">
            <span id="labelReason" class="text-slate-400 font-medium">Motivo</span>
            <span id="reason" class="font-bold text-rose-400"></span>
          </div>
          <div class="flex justify-between border-b border-slate-800 pb-2">
            <span id="labelDate" class="text-slate-400 font-medium">Data</span>
            <span id="date" class="font-semibold text-slate-200"></span>
          </div>
          
          <!-- RATING DE SCORE COM BARRA INTERATIVA -->
          <div>
            <div class="flex justify-between mb-1">
              <span id="labelScore" class="text-slate-400 font-medium">Score</span>
              <span id="score" class="font-mono font-bold text-slate-100"></span>
            </div>
            <!-- Barra de Progresso Dinâmica -->
            <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
              <div id="scoreBar" class="h-full rounded-full transition-all duration-1000 bg-emerald-500" style="width: 0%"></div>
            </div>
          </div>
        </div>

      </div>

      <!-- BOTÃO FECHAR -->
      <div class="pt-2">
        <button id="closeBtn" class="w-full py-4 bg-slate-800 hover:bg-slate-700/80 text-slate-200 hover:text-white font-semibold rounded-xl border border-slate-700/50 shadow-lg active:scale-[0.98] transition-all duration-200">
          Fechar
        </button>
      </div>

    </div>

  </div>
</body>
</html>
